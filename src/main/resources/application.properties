spring.application.name=plantly

spring.profiles.active=local

# ===== Flyway =====
# 기본 비활성(opt-in). Postgres 환경(local/운영)에서만 명시적으로 켠다.
# H2 테스트나 신규 프로파일이 실수로 PG 전용 마이그레이션(pg_trgm 등)을 타는 것을 구조적으로 차단.
spring.flyway.enabled=false

spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.use_sql_comment=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ===== Pageable =====
# 클라이언트가 ?size=100000 같은 과도한 페이지 크기를 요청해도 이 값으로 제한.
spring.data.web.pageable.max-page-size=100
# 요청 page 파라미터를 1-based로 받는다. (?page=1 → 첫 페이지)
# 내부 Pageable.getPageNumber()는 여전히 0-based이므로 PageResponse 의 (+1) 변환과 일관됨.
spring.data.web.pageable.one-indexed-parameters=true

# ===== Session (JSESSIONID) =====
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
# 동일 사이트(예: localhost:3000 -> localhost:8080)에서는 lax로 충분.
# 프로덕션에서 FE/BE 도메인이 완전히 다르면 same-site=none + cookie.secure=true 로 변경 필요.
server.servlet.session.cookie.same-site=lax

# ===== Remember-Me =====
# 30일 영속 로그인 토큰 서명 키. 프로덕션에서는 환경변수/시크릿으로 반드시 외부화할 것.
app.remember-me.key=${REMEMBER_ME_KEY:plantly-remember-me-dev-key-change-me}

# ===== CORS (FE/BE origin이 다를 때) =====
# 쉼표로 여러 origin 지정 가능. allowCredentials=true 이므로 와일드카드(*)는 사용 불가.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ===== 메인 화면 노출 영역(스팟라이트/추천/최근 등록) =====
# 각 레일에 실제로 노출할 자리 수. 후보(요금제 자격 + 관리자 고정)가 이 값을 넘으면 초과분은 잘리고
# CompanyQueryService 가 경고 로그를 남긴다. 상수가 아니라 설정값인 이유는 "자리를 늘린다"가
# 초과에 대한 가장 흔한 대응이라 코드 수정 없이 대응할 수 있어야 하기 때문이다.
app.showcase.spotlight-slots=5
app.showcase.featured-slots=8

# 최근 등록 레일. 위 둘과 달리 노출 자격이 아니라 화면 분량이라 초과 경고를 붙이지 않는다
# (후보가 공개 회사 전체라 항상 초과다). 더 보려면 목록 화면으로 넘어가므로 늘릴 이유가 없다.
app.showcase.latest-slots=12

# ===== 국세청 사업자등록정보 진위확인/상태조회 API =====
# 공공데이터포털에서 발급받은 서비스 키. 시크릿이므로 커밋된 기본값 없이 환경변수(NTS_SERVICE_KEY)로만 주입한다.
# 로컬: 셸/IDE 실행 환경변수로 설정. CI: GitHub Actions secret. 운영: 배포 환경 환경변수.
# 반드시 '디코딩된' 키를 넣는다 — 인코딩된 키를 넣으면 이중 인코딩되어 인증 오류가 난다.
app.nts.service-key=${NTS_SERVICE_KEY:}

# 가짜 클라이언트 사용 여부. 기본 false(=실제 호출)이며, false 인데 service-key 가 비어 있으면 부팅이 실패한다.
# "키가 없으면 자동으로 fake" 로 하지 않는 이유는, 운영에서 환경변수 주입이 실패했을 때
# 조용히 아무 사업자번호나 통과시키는 사고를 막기 위해서다. 로컬/테스트에서만 명시적으로 true 로 켠다.
app.nts.fake=${NTS_FAKE:false}

# ===== 사업자 인증 정책 =====
# 발급된 인증의 유효기간. 짧게 잡는다고 더 안전해지지 않는다 — 이 값이 막는 것은 "인증만 받아두고 방치한
# 사이 폐업 등으로 상태가 바뀌는 것" 인데, 그건 분 단위로 일어나는 사건이 아니다. 반대로 짧으면 정상
# 사용자가 폼 작성 도중 만료를 만나고, 그때마다 발행 경로가 국세청에 재질의해 쿼터만 두 배로 쓴다.
# 그 사이의 상태 변화는 발행 시점 자동 재질의(CompanyVerificationService#refreshIfExpired)가 대신 막는다.
app.verification.ttl=${VERIFICATION_TTL:7d}
# 하루에 사용자가 직접 누를 수 있는 인증 시도 횟수. 자동 재질의는 여기서 빠진다(사용자가 누른 적 없는 호출).
app.verification.daily-attempt-limit=${VERIFICATION_DAILY_ATTEMPT_LIMIT:5}

# 국세청 응답이 느려질 때 요청 스레드를 오래 붙잡지 않도록 짧게 잡는다.
app.nts.connect-timeout=3s
app.nts.read-timeout=5s

# ===== 파일 업로드 =====
# 두 상한은 층이 다르다. 서블릿 상한은 요청 본문을 다 받기 전에 끊어 거대한 업로드를 버퍼링하지 않게 하는
# 방어선이고, app.upload.max-file-size 는 UploadService 가 스스로 확인하는 계약이다. 같은 값으로 맞춰 둔다
# (서블릿 상한만 두면 서비스를 직접 호출하는 경로에 제한이 없고, 반대면 10GB 요청도 일단 다 받는다).
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:10MB}
# 단건 업로드라 요청 = 파일 하나 + 폼 오버헤드다. 파일 상한보다 조금만 크게 잡는다.
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:12MB}
app.upload.max-file-size=${UPLOAD_MAX_FILE_SIZE:10MB}

# 로컬 디스크 저장 위치. 저장소가 S3/Supabase 로 바뀌면 이 블록 대신 형제 블록(app.upload.s3.*)이 생기고,
# 발급되는 URL(/api/v1/files/{key})과 회사 DTO 는 그대로다.
app.upload.local.base-dir=${UPLOAD_DIR:./uploads}
